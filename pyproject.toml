[project]
name = "airbnb-surroundings-multabench"
version = "0.1.0"
description = "Airbnb + OSM text-tabular dataset build + MulTaBench eligibility"
requires-python = ">=3.11"
# Launcher-only environment. The heavy stages (build/describe/benchmark) all run in
# MulTaBench/.venv, which init.sh builds with tabstar/torch and the dataset-build
# libraries. run.py uses only the standard library to dispatch into that
# interpreter, so duplicating those dependencies here only wastes disk and setup
# time.
dependencies = []

# Dataset-build libraries, installed by init.sh INTO MulTaBench/.venv via
# `-e ".[pipeline]"`; plain `uv sync` skips them. pandas/numpy/python-dotenv come
# from MulTaBench's own requirements, so they are not listed here.
[project.optional-dependencies]
pipeline = [
    "geopandas",   # stage 1: Overture Places POI enrichment (build.py)
    "duckdb",      # stage 1
    "rapidfuzz",   # stage 1
    "pydantic-ai", # stage 2: LLM surroundings summary (describe.py)
]

# uv script entry points. `main` = whole pipeline; the rest drive one stage each.
# All dispatch into MulTaBench/.venv (see run.py), so they work from `uv run`.
[project.scripts]
main = "run:main"
clean = "run:clean"        # stage 0: raw scrape -> data/airbnb.csv (pandas)
build = "run:build"        # stage 1: -> artifacts/airbnb_enriched.csv (Overture POIs)
describe = "run:describe"  # stage 2: -> data/processed/airbnb_described_<prompt>.csv (LLM)
stage = "run:stage"        # stage 3: -> registered datasets in the local HF cache (offline)
bench = "run:bench"        # stage 4: -> official benchmark runs (GPU; --confirm required)
report = "run:report"      # stage 5: -> results/metrics.csv + curation verdict

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship the pipeline package (src layout) + the flat run.py launcher module.
# init.sh installs this `-e .[pipeline]` into MulTaBench/.venv so `-m src.*`
# resolves there; `uv sync` installs it into the thin ./.venv for `uv run main`.
[tool.hatch.build.targets.wheel]
packages = ["src"]
force-include = { "run.py" = "run.py" }
