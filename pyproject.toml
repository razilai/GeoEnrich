[project]
name = "airbnb-surroundings-multabench"
version = "0.1.0"
description = "Airbnb + OSM text-tabular dataset build + MulTaBench eligibility eval"
requires-python = ">=3.11"
# Launcher-only environment. The heavy stages (build/describe/eval) all run in
# MulTaBench/.venv, which init.sh builds with tabstar/torch and the dataset-build
# libraries. run.py uses only the standard library to dispatch into that
# interpreter, so duplicating those dependencies here only wastes disk and setup
# time.
dependencies = []

# uv script entry points. `main` = whole pipeline; the rest drive one stage each.
# All dispatch into MulTaBench/.venv (see run.py), so they work from `uv run`.
[project.scripts]
main = "run:main"
clean = "run:clean"        # stage 0: raw scrape -> data/airbnb.csv (PySpark)
clean-pandas = "run:clean_pandas"  # stage 0, pandas twin (no JVM)
build = "run:build"        # stage 1: -> artifacts/airbnb_enriched.csv (Overture POIs)
describe = "run:describe"  # stage 2: -> artifacts/airbnb_described.csv (LLM)
enrich = "run:enrich"      # full fine-schema corpus with fixed prompt 16
eval = "run:evaluate"      # stage 3: MulTaBench eligibility (needs GPU)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship the pipeline package (src layout) + the flat run.py launcher module.
# init.sh installs this `-e` into MulTaBench/.venv so `-m airbnb_surroundings.*`
# resolves there; `uv sync` installs it into the thin ./.venv for `uv run main`.
[tool.hatch.build.targets.wheel]
packages = ["airbnb_surroundings"]
force-include = { "run.py" = "run.py" }
