[project]
name = "house-price-multimodal"
version = "0.1.0"
description = "Semi-synthetic image-text-tabular pipeline + MulTaBench eligibility eval"
requires-python = ">=3.11"
# Thin orchestrator: heavy stages run in MulTaBench/.venv (see main.py). The
# actual pipeline libraries (diffusers/torch/etc.) are installed into that venv
# by init.sh from requirements.txt, not here.
dependencies = []

[project.scripts]
main = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
force-include = { "main.py" = "main.py" }
