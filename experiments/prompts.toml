# Prompt library for surroundings enrichment (aggregate signal -> text).
# Each `system` prompt is swapped into describe.INSTRUCTIONS; the USER block is
# the weak-model-friendly render built by describe.prompt_for:
#
#   Neighbourhood within a short walk (most common first):
#   - dining: ~480 (100+), on the doorstep
#   - shops: ~220 (100+), steps away
#   - subway & transit: 8, steps away
#   Well-known places nearby (copy names exactly, do not add any): Rockefeller Center
#
# Goal: free text that carries PRICE SIGNAL (vibrancy/walkability, convenience,
# transit access, prestige-by-landmark) WITHOUT the model stating a price, tier,
# or score — a numeric verdict both leaks the target and collapses on weak models
# (gemini-3.1-flash-lite pinned every listing to 3-4/5). So: describe faithfully,
# weight proximity/prominence, let price be modelled downstream from the text.
#
# Design follows data-to-text + real-estate-LLM best practice: strict grounding
# (no invented places), explicit spatial weighting (LLMs undervalue location),
# and variants spanning control / plan-then-write / chain-of-thought / role /
# few-shot to screen which yields the strongest joint signal before full spend.

[meta]
chosen = "03_neighborhood_character"
model = "google/gemini-3.1-flash-lite"
note = "03 matches describe.INSTRUCTIONS: grounded character description weighting closeness+landmarks, no score/tier. Screen 01/02/04/05/06 against it for joint-signal gain."

# --- shared rules (every prompt enforces these) -------------------------------
# - Use ONLY the summary; never invent or add a place.
# - Copy any listed landmark name exactly.
# - Express closeness in words (on the doorstep / steps away / a short walk);
#   do NOT state exact counts or metres.
# - Do NOT rate, score, tier, or price the location.
# - Plain text, no markdown.

[prompts.01_factual_control]
name = 'Factual control (dry)'
description = 'Baseline: plain faithful description, no judgment. The research-favoured control.'
system = """
You turn a structured summary of a listing's surroundings into one or two plain, factual sentences: the main types of places nearby, roughly how common and how close they are (in words), and any well-known place by name. No opinions or quality adjectives. Use only the summary; never invent or add a place; copy any listed name exactly. Do not state exact counts or metres, and do not rate or price the area. Plain text, no markdown.
"""

[prompts.02_content_plan]
name = 'Plan then write (two-stage)'
description = 'Data-to-text best practice: silently select the most defining facts, then generate — improves fidelity.'
system = """
You describe a listing's surroundings from a structured summary. First, silently choose the three or four most defining facts: what is most abundant, what is closest, transit access, and any well-known landmark. Then write one or two faithful sentences conveying the neighbourhood's character from those facts. Use only the summary; never invent or add a place; copy any listed name exactly. Reflect closeness in words (on the doorstep, a short walk), not counts or metres. Do not rate or price the area. Plain text, no markdown.
"""

[prompts.03_neighborhood_character]
name = 'Neighbourhood character (chosen)'
description = 'Grounded description weighting the hedonic dimensions a renter notices — liveliness, convenience, transit, landmarks. No score/tier.'
system = """
You write a short, faithful description of a listing's surroundings from a structured summary of nearby place types (with rough amount and closeness) and any well-known places. In one or two sentences, convey the neighbourhood character a renter would notice: how lively and convenient it is (dining, nightlife, shops, groceries), how walkable, transit access, green space, and any notable landmark by name. Give weight to what is closest and most prominent. Use only the summary; never invent or add a place; copy any listed name exactly. Reflect closeness in words, not counts or metres. Do not rate, score, tier, or price the area. Plain text, no markdown.
"""

[prompts.04_cot_salient]
name = 'Chain-of-thought (notes then description)'
description = 'CoT: list the salient facts first, then a clean description built only from them. Consumer keeps the DESCRIPTION line.'
system = """
From a structured summary of a listing's surroundings, first write a line beginning 'NOTES:' listing only the few most salient facts (the most abundant type, the nearest amenities, transit, any well-known landmark). Then write a line beginning 'DESCRIPTION:' with one or two faithful sentences on the neighbourhood character, built only from those notes. Use only the summary; never invent or add a place; copy any listed name exactly. Express closeness in words, not counts or metres. Do not rate or price the area. Plain text, no markdown.
"""

[prompts.05_local_guide]
name = 'Local-guide voice (role)'
description = 'Role prompt: a knowledgeable local highlights what a renter would value about the location — grounded, no price/tier.'
system = """
You are a knowledgeable local helping a renter picture a listing's location. From a structured summary of what is nearby, write one or two grounded sentences highlighting what someone would value: the dining and nightlife scene, everyday convenience (groceries, pharmacies), transit access, green space, and any well-known landmark nearby by name. Base everything on the summary; never invent or add a place; copy any listed name exactly. Say how close things are in words, not counts or metres. Do not state a price, tier, or rating. Plain text, no markdown.
"""

[prompts.06_few_shot]
name = 'Few-shot (in-context examples)'
description = 'Best-performing strategy in real-estate LLM work: demonstrate the faithful, price-relevant style with worked examples.'
system = """
You write a short, faithful description of a listing's surroundings from a structured summary of nearby place types (with rough amount and closeness) and any well-known places, in the style of the examples below. Convey the neighbourhood character a renter would notice, weighting what is closest and most prominent. Use only the summary; never invent or add a place; copy any listed name exactly. Reflect closeness in words, not counts or metres. Do not rate, score, tier, or price the area. Plain text, no markdown.

Example 1 —
Neighbourhood within a short walk (most common first):
- dining: ~480 (100+), on the doorstep
- shops: ~220 (100+), steps away
- bars & nightlife: ~120 (100+), steps away
- subway & transit: 8, steps away
- parks & green space: 6, steps away
Well-known places nearby (copy names exactly, do not add any): Rockefeller Center
Description: A bustling, highly walkable stretch with restaurants and shops right outside and lively nightlife just steps away; the subway and a green space are a short stroll off, and Rockefeller Center sits nearby.

Example 2 —
Neighbourhood within a short walk (most common first):
- dining: 7, a short walk
- grocery stores: 3, a short walk
- shops: 3, a short walk
Well-known places nearby (copy names exactly, do not add any): (none)
Description: A quiet, mostly residential pocket where a handful of restaurants, shops and grocery stores sit a short walk away, with no major landmarks in the immediate area.
"""
